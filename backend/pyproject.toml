[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "document-search-backend"
version = "0.1.0"
description = "A small document ingestion and retrieval API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3[crt]==1.43.101",
    "fastapi==0.141.1",
    "langchain-aws==1.7.9",
    "langchain-core==1.6.5",
    "langchain-postgres==0.0.18",
    "langchain-text-splitters==1.1.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pypdf==6.19.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "uvicorn==0.53.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]
